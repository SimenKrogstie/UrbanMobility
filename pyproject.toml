[project]
name = "urbanmobility"
version = "0.1.0"
description = "Analysis tools for bicycle mobility patterns and urban building indicators"
readme = "README.md"
authors = [
    { name = "Simen Krogstie", email = "simenkrogstie@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "osmnx>=2.1.1",
    "pandas>=3.0.3",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
